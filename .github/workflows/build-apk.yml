name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        continue-on-error: true
        run: |
          set +e
          gradle test --no-daemon --stacktrace > test.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "^e: |What went wrong|FAILED|AssertionError|expected:" -A3 test.log | head -60 > test-errors.txt
            msg=$(head -c 3000 test-errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Unit tests failed::${msg}"
          else
            echo "::notice title=Unit tests::Todos los tests unitarios pasaron"
          fi
          exit $status

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "^e: |What went wrong|Execution failed|Could not |Duplicate class|Manifest merger|AAPT|error:|Unresolved reference|Type mismatch|FAILED" -A3 build.log | head -80 > errors.txt
            msg=$(head -c 3500 errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build error::${msg}"
          fi
          exit $status

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
